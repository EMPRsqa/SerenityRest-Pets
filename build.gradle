plugins {
    id 'java'
}

group = 'com.petstore'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    serenityVersion = '4.0.12'
    cucumberVersion = '7.14.0'
}

dependencies {
    // Serenity BDD, Screenplay y Rest
    implementation "net.serenity-bdd:serenity-core:${serenityVersion}"
    implementation "net.serenity-bdd:serenity-rest-assured:${serenityVersion}"
    implementation "net.serenity-bdd:serenity-screenplay:${serenityVersion}"
    implementation "net.serenity-bdd:serenity-screenplay-rest:${serenityVersion}"

    // Serenity Cucumber y JUnit 4 (Obligatorio para Runner.java)
    implementation "net.serenity-bdd:serenity-cucumber:${serenityVersion}"
    implementation "io.cucumber:cucumber-java:${cucumberVersion}"
    implementation "io.cucumber:cucumber-junit:${cucumberVersion}"
    implementation 'junit:junit:4.13.2'

    // Apache POI para leer Excel (.xlsx)
    implementation 'org.apache.poi:poi:5.2.3'
    implementation 'org.apache.poi:poi-ooxml:5.2.3'

    // Logging
    implementation 'org.slf4j:slf4j-simple:2.0.7'
}

test {
    useJUnit() // Usar JUnit 4 para ejecutar los runners de Serenity-Cucumber
    systemProperties['file.encoding'] = 'UTF-8'
}

gradle.startParameter.continueOnFailure = true